[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsim-arde-backend"
version = "1.0.0"
description = "CrowdSim runtime with the ARDE emergency crowd-control engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["arde_emergency*"]

[tool.setuptools.package-data]
arde_emergency = ["README.md", "examples/*.json"]
